[package]
name = "molangx-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = "1.4"
libfuzzer-sys = "0.4"

[dependencies.molangx]
path = ".."
features = ["vm", "fuzz", "stdlib"]

[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
serde_json = "1.0"

# Keeps this package out of the root crate's workspace.
[workspace]

[[bin]]
name = "lex_parse"
path = "fuzz_targets/lex_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compile_eval"
path = "fuzz_targets/compile_eval.rs"
test = false
doc = false
bench = false

[[bin]]
name = "repr_roundtrip"
path = "fuzz_targets/repr_roundtrip.rs"
test = false
doc = false
bench = false
