[package]
name = "molangx"
description = "A pure-Rust compiler and bytecode VM for Molang, the expression language of Minecraft: Bedrock Edition content"
version = "0.1.0"
edition = "2024"
# The minimum of the `facet` crates.
rust-version = "1.92"
repository = "https://github.com/bedrock-crustaceans/molangx"
documentation = "https://docs.rs/molangx"
license = "Apache-2.0"
readme = "README.md"
keywords = ["molang", "minecraft", "bedrock"]
categories = ["parser-implementations", "game-development"]
include = ["/src/**", "/examples/**", "/README.md", "/LICENSE"]

[package.metadata.docs.rs]
all-features = true
# Shows which feature each item needs.
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["stdlib"]
# The standard library: the `math.*` functions and the queries a script can name out of the box.
stdlib = ["dep:libm"]
compiler = ["dep:rand_core"]
vm = ["compiler", "dep:smallvec", "dep:rustc-hash", "dep:nohash-hasher"]
cache = ["compiler", "dep:dashmap"]
facet = ["dep:facet"]
# Test support for `fuzz/`, not covered by SemVer.
fuzz = ["stdlib"]

[dependencies]
thiserror = "2.0"
bitflags = "2.13"
# Engine versions and game releases; re-exported as `version::semver`.
semver = "1.0.28"
libm = { version = "0.2.16", optional = true }
smallvec = { version = "1.13", optional = true }
rustc-hash = { version = "2.1", optional = true, default-features = false }
nohash-hasher = { version = "0.2", optional = true, default-features = false }
dashmap = { version = "6.1", optional = true }
# The random-source crate, re-exported as `rng::rand_core`.
rand_core = { version = "0.10.1", optional = true, default-features = false }
# A pre-release: the caret requirement on `0.50.0-rc.7` admits later rcs and 0.50 final.
facet = { version = "0.50.0-rc.7", optional = true }

[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
serde_json = "1.0"
# The same pre-release requirement as `facet`.
facet-json = "0.50.0-rc.7"

[[example]]
name = "cache"
required-features = ["cache", "stdlib"]

[[example]]
name = "hello_world"
required-features = ["vm", "stdlib"]

[[example]]
name = "json_forms"

[[example]]
name = "diagnostics"
required-features = ["compiler", "stdlib"]

[[example]]
name = "restricted"
required-features = ["compiler", "stdlib"]

[[example]]
name = "host"
required-features = ["vm", "stdlib"]

[[example]]
name = "variables"
required-features = ["vm", "stdlib"]

[[example]]
name = "versions"
required-features = ["compiler", "stdlib"]

[[example]]
name = "math"
required-features = ["vm", "stdlib"]

[[bench]]
name = "eval"
harness = false
required-features = ["vm", "stdlib"]

[[bench]]
name = "compile"
harness = false
required-features = ["compiler", "stdlib"]
